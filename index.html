
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>INPSYT 2026 Catalog Viewer</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #0f172a;
      --muted: #6b7280;
      --accent: #2B398F;
      --accent-soft: rgba(34, 100, 255, 0.08);
      --shadow: 0 18px 34px rgba(15, 23, 42, 0.12);
      --thumbnail-space: 220px;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans KR', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }
    body.nav-hidden #tocPanel {
      transform: translateX(-100%);
      box-shadow: none;
    }
    body.nav-hidden #openNavHandle {
      opacity: 1;
      pointer-events: auto;
    }
    body.fullscreen-active #openNavHandle {
      top: 16px;
    }
    body.thumbnails-collapsed {
      --thumbnail-space: 96px;
    }
    body.thumbnails-collapsed #thumbnailStrip {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    body.thumbnails-collapsed #thumbnailBar {
      transform: translateY(calc(100% - 48px));
    }
    .app-shell {
      flex: 1;
      display: flex;
      width: 100%;
      height: 100vh;
      min-width: 0;
      overflow: hidden;
    }
    aside#tocPanel {
      width: 320px;
      flex: 0 0 320px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      transition: transform 0.3s ease;
      z-index: 30;
    }
    #tocPanel header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    #collapseNav {
      border: none;
      background: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--muted);
    }
    .nav-section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .nav-section h2 {
      margin: 0 0 12px;
      font-size: 0.9rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .nav-section.quick-links {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding-right: 8px;
    }
    #quickLinks {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0;
    }
    #quickLinks button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: #f9fafb;
      text-align: left;
      font-size: 0.82rem;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    #quickLinks button strong {
      font-size: 0.8rem;
      color: var(--accent);
    }
    #quickLinks button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    #openNavHandle {
      position: fixed;
      left: 16px;
      top: 24px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 40;
    }
    main#viewerApp {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    .viewer-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-group label {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .page-controls,
    .zoom-controls,
    .view-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      background: #f9fafb;
    }
    .page-controls input,
    .zoom-controls input {
      width: 64px;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 0.9rem;
      outline: none;
    }
    .page-controls span,
    .zoom-controls span {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .toolbar-button {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      background: var(--panel);
      cursor: pointer;
      font-size: 0.9rem;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .toolbar-button.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .toolbar-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1rem;
    }
    .search-bar {
      padding: 12px 24px 0;
    }
    .search-field {
      position: relative;
      width: min(480px, 100%);
      margin-left: auto;
    }
    #searchInput {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.95rem;
      outline: none;
    }
    #searchResults {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: min(520px, 100vw - 32px);
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: none;
      z-index: 12;
    }
    #searchResults.visible {
      display: block;
    }
    #searchResults button {
      width: 100%;
      border: none;
      background: none;
      text-align: left;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    #searchResults button:last-child {
      border-bottom: none;
    }
    #searchResults strong {
      display: block;
      font-size: 0.92rem;
      margin-bottom: 4px;
    }
    #searchResults span {
      font-size: 0.82rem;
      color: var(--muted);
    }
    #viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      position: relative;
    }
    #pageStage {
      flex: 1;
      overflow: auto;
      position: relative;
      padding: 24px;
      padding-bottom: calc(var(--thumbnail-space) + 24px);
      background: linear-gradient(135deg, #fdfdff 0%, #f4f6fb 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
    }
    #spread {
      display: inline-flex;
      gap: 24px;
      transform-origin: top center;
      transition: transform 0.15s ease;
    }
    .page-sheet {
      position: relative;
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      background: #fff;
    }
    .page-sheet img {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
    }
    .page-sheet figcaption {
      position: absolute;
      bottom: 12px;
      left: 16px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(34, 100, 255, 0.85);
      color: #fff;
      font-size: 0.8rem;
    }
    #thumbnailBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 24px 18px;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      box-shadow: 0 -14px 32px rgba(15, 23, 42, 0.18);
      z-index: 50;
      transition: transform 0.25s ease;
    }
    @media (min-width: 1025px) {
      body:not(.nav-hidden) #thumbnailBar {
        left: 320px;
        width: calc(100% - 320px);
      }
    }
    #toggleThumbnails {
      align-self: flex-end;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      padding: 6px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      box-shadow: var(--shadow);
    }
    #thumbnailStrip {
      display: flex;
      gap: 10px;
      padding: 6px 0;
      overflow-x: auto;
      transition: max-height 0.2s ease, opacity 0.2s ease;
      max-height: 160px;
    }
    #thumbnailStrip button {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 4px;
      background: none;
      cursor: pointer;
      display: grid;
      gap: 4px;
      min-width: 96px;
    }
    #thumbnailStrip button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    #thumbnailStrip img {
      width: 100%;
      border-radius: 8px;
      display: block;
    }
    #thumbnailStrip span {
      font-size: 0.78rem;
      text-align: center;
      color: var(--muted);
    }
    @media (max-width: 1024px) {
      aside#tocPanel {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        height: 100vh;
        box-shadow: var(--shadow);
      }
      body.nav-hidden main#viewerApp {
        margin-left: 0;
      }
    }
    @media (max-width: 768px) {
      .viewer-toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .search-bar {
        padding: 12px 16px 0;
        width: 100%;
      }
      #pageStage {
        padding: 16px;
      }
      #thumbnailStrip {
        padding: 10px;
      }
    }
  </style>
</head>
<body class="nav-hidden">
  <button id="openNavHandle">목차 열기</button>
  <div class="app-shell">
    <aside id="tocPanel">
      <header>
        <div>
          <div style="font-weight:600; font-size:1rem;">INPSYT Catalog</div>
          <small style="color:var(--muted);">2026</small>
        </div>
        <button id="collapseNav" title="목차 접기">⟨</button>
      </header>
      <section class="nav-section quick-links">
        <h2>빠른 이동</h2>
        <div id="quickLinks"></div>
      </section>
    </aside>
    <main id="viewerApp">
      <div class="viewer-toolbar">
        <div class="toolbar-group">
          <button class="toolbar-button" id="navToggle" type="button">목차</button>
          <div class="page-controls">
            <button class="toolbar-icon" id="prevPage" aria-label="이전">‹</button>
            <input type="number" id="pageInput" min="1" value="1" />
            <span>/ <span id="totalPages">0</span></span>
            <button class="toolbar-icon" id="nextPage" aria-label="다음">›</button>
          </div>
          <div class="view-controls">
            <button class="toolbar-button" data-view="single" id="singleView">한면</button>
            <button class="toolbar-button" data-view="dual" id="dualView">두면</button>
          </div>
        </div>
        <div class="toolbar-group">
          <div class="zoom-controls">
            <button class="toolbar-button" data-fit="width">가로맞춤</button>
            <button class="toolbar-button" data-fit="height">세로맞춤</button>
            <button class="toolbar-icon" id="zoomOut">−</button>
            <input type="number" id="zoomPercent" value="100" min="10" max="400" />
            <span>%</span>
            <button class="toolbar-icon" id="zoomIn">+</button>
          </div>
          <button class="toolbar-button" id="fullscreenToggle">전체화면</button>
          <button class="toolbar-button" id="openPdf">PDF 보기</button>
        </div>
      </div>
      <div class="search-bar">
        <div class="search-field">
          <input type="text" id="searchInput" placeholder="카탈로그 전체 검색" autocomplete="off" />
          <div id="searchResults"></div>
        </div>
      </div>
      <section id="viewer">
        <div id="pageStage">
          <div id="spread"></div>
        </div>
        <div id="thumbnailBar">
          <button type="button" id="toggleThumbnails">썸네일 접기</button>
          <div id="thumbnailStrip"></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    (function () {
            let quickLinks = [];
      const state = {
        pages: [],
        activeIndex: 0,
        displayMode: 'single',
        zoomMode: 'fit-width',
        zoomPercent: 100,
        spreadWidth: 0,
        spreadHeight: 0,
        pdfUrl: '2026 인싸이트 카달로그.pdf'
      };
      window.__viewerState = state;

      const elements = {
        body: document.body,
        quickLinks: document.getElementById('quickLinks'),
        searchInput: document.getElementById('searchInput'),
        searchResults: document.getElementById('searchResults'),
        navToggle: document.getElementById('navToggle'),
        collapseNav: document.getElementById('collapseNav'),
        openNavHandle: document.getElementById('openNavHandle'),
        pageInput: document.getElementById('pageInput'),
        totalPages: document.getElementById('totalPages'),
        prevPage: document.getElementById('prevPage'),
        nextPage: document.getElementById('nextPage'),
        singleView: document.getElementById('singleView'),
        dualView: document.getElementById('dualView'),
        zoomButtons: document.querySelectorAll('.zoom-controls .toolbar-button[data-fit]'),
        zoomIn: document.getElementById('zoomIn'),
        zoomOut: document.getElementById('zoomOut'),
        zoomPercent: document.getElementById('zoomPercent'),
        fullscreenToggle: document.getElementById('fullscreenToggle'),
        openPdf: document.getElementById('openPdf'),
        viewerApp: document.getElementById('viewerApp'),
        viewer: document.getElementById('viewer'),
        viewerToolbar: document.querySelector('.viewer-toolbar'),
        searchBar: document.querySelector('.search-bar'),
        spread: document.getElementById('spread'),
        pageStage: document.getElementById('pageStage'),
        thumbnailStrip: document.getElementById('thumbnailStrip'),
        thumbnailBar: document.getElementById('thumbnailBar'),
        toggleThumbnails: document.getElementById('toggleThumbnails')
      };
      window.__viewerElements = elements;

      function buildImagePath(fileName) {
        if (!fileName) {
          return '';
        }
        return fileName.startsWith('webp/') ? fileName : `webp/${fileName}`;
      }

      function hideNav() {
        elements.body.classList.add('nav-hidden');
      }

      function showNav() {
        elements.body.classList.remove('nav-hidden');
      }

      elements.navToggle.addEventListener('click', () => {
        if (elements.body.classList.contains('nav-hidden')) {
          showNav();
        } else {
          hideNav();
        }
      });

      elements.collapseNav.addEventListener('click', hideNav);
      elements.openNavHandle.addEventListener('click', showNav);

      function handleResize() {
        if (window.innerWidth <= 1024) {
          hideNav();
        } else {
          showNav();
        }
        applyZoom();
      }

      window.addEventListener('resize', handleResize);

      function goToPage(pageNumber) {
        if (!state.pages.length) return;
        const clamped = Math.min(Math.max(pageNumber, 1), state.pages.length);
        let index = clamped - 1;
        if (state.displayMode === 'dual' && index % 2 !== 0) {
          index -= 1;
        }
        state.activeIndex = Math.max(0, Math.min(index, state.pages.length - 1));
        renderSpread();
      }

      function stepPage(direction) {
        if (!state.pages.length) return;
        const step = state.displayMode === 'dual' ? 2 : 1;
        goToPage(state.pages[state.activeIndex].page + direction * step);
      }

      elements.prevPage.addEventListener('click', () => stepPage(-1));
      elements.nextPage.addEventListener('click', () => stepPage(1));

      elements.pageInput.addEventListener('change', (event) => {
        goToPage(Number(event.target.value));
      });

      function setDisplayMode(mode) {
        state.displayMode = mode;
        elements.singleView.classList.toggle('active', mode === 'single');
        elements.dualView.classList.toggle('active', mode === 'dual');
        renderSpread();
      }

      elements.singleView.addEventListener('click', () => setDisplayMode('single'));
      elements.dualView.addEventListener('click', () => setDisplayMode('dual'));

      function setZoomMode(mode) {
        state.zoomMode = mode;
        elements.zoomButtons.forEach((button) => {
          button.classList.toggle('active', button.dataset.fit === mode);
        });
        applyZoom();
      }

      elements.zoomButtons.forEach((button) => {
        button.addEventListener('click', () => setZoomMode(button.dataset.fit));
      });

      function setManualZoom(percent) {
        state.zoomMode = 'manual';
        state.zoomPercent = Math.min(Math.max(percent, 10), 400);
        elements.zoomButtons.forEach((button) => button.classList.remove('active'));
        applyZoom();
      }

      elements.zoomIn.addEventListener('click', () => setManualZoom((elements.zoomPercent.valueAsNumber || state.zoomPercent) + 10));
      elements.zoomOut.addEventListener('click', () => setManualZoom((elements.zoomPercent.valueAsNumber || state.zoomPercent) - 10));
      elements.zoomPercent.addEventListener('change', (event) => setManualZoom(event.target.valueAsNumber || state.zoomPercent));

      function getAvailableWidth() {
        const width = elements.viewerApp?.clientWidth || window.innerWidth;
        return Math.max(width - 48, 200);
      }

      function getAvailableHeight() {
        const toolbarHeight = elements.viewerToolbar?.offsetHeight || 0;
        const searchHeight = elements.searchBar?.offsetHeight || 0;
        const thumbnailHeight = elements.body.classList.contains('thumbnails-collapsed')
          ? 56
          : elements.thumbnailBar?.offsetHeight || 0;
        return Math.max(window.innerHeight - toolbarHeight - searchHeight - thumbnailHeight - 24, 200);
      }

      function applyZoom() {
        if (!state.spreadWidth || !state.spreadHeight) {
          return;
        }
        const availableWidth = getAvailableWidth();
        const availableHeight = getAvailableHeight();
        let scale = state.zoomPercent / 100;

        if (state.zoomMode === 'fit-width') {
          scale = availableWidth / state.spreadWidth;
        } else if (state.zoomMode === 'fit-height') {
          scale = availableHeight / state.spreadHeight;
        }
        scale = Math.min(Math.max(scale, 0.1), 4);
        elements.spread.style.transform = `scale(${scale})`;
        const percent = Math.round(scale * 100);
        state.zoomPercent = percent;
        elements.zoomPercent.value = percent;
      }

      function renderQuickLinks() {
        if (!elements.quickLinks) return;
        const fragment = document.createDocumentFragment();
        quickLinks.forEach((link) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.page = link.page;
          button.innerHTML = `<span>${link.title}</span><strong>${link.page}</strong>`;
          fragment.appendChild(button);
        });
        elements.quickLinks.innerHTML = '';
        elements.quickLinks.appendChild(fragment);
        const activePage = state.pages[state.activeIndex];
        if (activePage) {
          highlightQuickLink(activePage.page);
        }
      }

      function highlightQuickLink(pageNumber) {
        if (!elements.quickLinks) return;
        elements.quickLinks.querySelectorAll('button').forEach((button) => {
          button.classList.toggle('active', Number(button.dataset.page) === pageNumber);
        });
      }

      function loadQuickLinks() {
        fetch('quicklinks.json', { cache: 'no-store' })
          .then((response) => response.json())
          .then((data) => {
            quickLinks = data;
            renderQuickLinks();
            updateActiveIndicators();
          })
          .catch((error) => {
            console.error('빠른 이동 데이터를 불러오지 못했습니다.', error);
          });
      }

      if (elements.quickLinks) {
        elements.quickLinks.addEventListener('click', (event) => {
          const button = event.target.closest('button');
          if (!button) return;
          goToPage(Number(button.dataset.page));
        });
      }

      function buildSnippet(text, keyword) {
        if (!text) return '';
        const clean = text.replace(/\s+/g, ' ').trim();
        if (!clean) return '';
        if (!keyword) return clean.slice(0, 120);
        const escaped = keyword.replace(/[.*+?^${}()|[\]\]/g, '\$&');
        const sentenceRegex = new RegExp(`[^.!?\n]*${escaped}[^.!?\n]*`, 'i');
        const match = clean.match(sentenceRegex);
        if (match) {
          return match[0].trim();
        }
        const lower = clean.toLowerCase();
        const idx = lower.indexOf(keyword.toLowerCase());
        if (idx !== -1) {
          const startIdx = Math.max(0, idx - 40);
          const endIdx = Math.min(clean.length, idx + keyword.length + 40);
          return `${clean.slice(startIdx, endIdx)}…`;
        }
        return clean.slice(0, 120);
      }

      function renderSearchResults(keyword) {
        const container = elements.searchResults;
        container.innerHTML = '';
        if (!keyword.trim()) {
          container.classList.remove('visible');
          return;
        }
        const term = keyword.trim();
        const lower = term.toLowerCase();
        const matches = state.pages.filter((page) => {
          const haystack = [page.title, page.note, page.text]
            .join(' ')
            .toLowerCase();
          return haystack.includes(lower);
        }).slice(0, 40);

        if (!matches.length) {
          const empty = document.createElement('div');
          empty.style.padding = '16px';
          empty.style.color = 'var(--muted)';
          empty.textContent = '검색 결과가 없습니다.';
          container.appendChild(empty);
        } else {
          matches.forEach((page) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.page = page.page;
            const snippet = buildSnippet(page.text || page.note || '', term) || '일치하는 문장을 찾지 못했습니다.';
            button.innerHTML = `<strong>${page.title || '제목 없음'} · ${page.page}p</strong><span>${snippet}</span>`;
            container.appendChild(button);
          });
        }
        container.classList.add('visible');
      }

      elements.searchInput.addEventListener('input', (event) => {
        renderSearchResults(event.target.value);
      });

      elements.searchResults.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        goToPage(Number(button.dataset.page));
        elements.searchInput.value = '';
        elements.searchResults.classList.remove('visible');
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('.search-field')) {
          elements.searchResults.classList.remove('visible');
        }
      });

      function renderThumbnails() {
        const fragment = document.createDocumentFragment();
        state.pages.forEach((page, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.index = index;
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = buildImagePath(page.file);
          img.alt = page.title || `Page ${page.page}`;
          const label = document.createElement('span');
          label.textContent = page.page;
          button.appendChild(img);
          button.appendChild(label);
          fragment.appendChild(button);
        });
        elements.thumbnailStrip.innerHTML = '';
        elements.thumbnailStrip.appendChild(fragment);
      }

      elements.thumbnailStrip.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        state.activeIndex = Number(button.dataset.index);
        renderSpread();
      });

      function updateThumbnailToggle() {
        const collapsed = elements.body.classList.contains('thumbnails-collapsed');
        elements.toggleThumbnails.textContent = collapsed ? '썸네일 펼치기' : '썸네일 접기';
        applyZoom();
      }

      elements.toggleThumbnails.addEventListener('click', () => {
        elements.body.classList.toggle('thumbnails-collapsed');
        updateThumbnailToggle();
      });
      function updateActiveIndicators() {
        const activePage = state.pages[state.activeIndex];
        if (!activePage) return;

        elements.pageInput.value = activePage.page;
        elements.totalPages.textContent = state.pages.length;
        highlightQuickLink(activePage.page);

        document.querySelectorAll('#thumbnailStrip button').forEach((button) => {
          button.classList.toggle('active', Number(button.dataset.index) === state.activeIndex);
        });
      }

      function renderSpread() {
        const firstPage = state.pages[state.activeIndex];
        if (!firstPage) return;
        const spreadPages = [firstPage];
        if (state.displayMode === 'dual') {
          const secondPage = state.pages[state.activeIndex + 1];
          if (secondPage) spreadPages.push(secondPage);
        }
        elements.spread.innerHTML = '';
        const figures = spreadPages.map((page) => {
          const figure = document.createElement('figure');
          figure.className = 'page-sheet';
          const img = document.createElement('img');
          img.src = buildImagePath(page.file);
          img.alt = page.title || `Page ${page.page}`;
          img.loading = 'lazy';
          img.addEventListener('load', measureSpread);
          const caption = document.createElement('figcaption');
          caption.textContent = `${page.page}p`;
          figure.appendChild(img);
          figure.appendChild(caption);
          return figure;
        });
        figures.forEach((figure) => elements.spread.appendChild(figure));
        updateActiveIndicators();
        measureSpread();
      }

      function measureSpread() {
        const images = elements.spread.querySelectorAll('img');
        if (!images.length) return;
        let width = 0;
        let height = 0;
        for (const img of images) {
          const naturalWidth = img.naturalWidth || 0;
          const naturalHeight = img.naturalHeight || 0;
          if (!naturalWidth || !naturalHeight) {
            return;
          }
          width += naturalWidth;
          height = Math.max(height, naturalHeight);
        }
        width += (images.length - 1) * 24;
        state.spreadWidth = width;
        state.spreadHeight = height;
        applyZoom();
      }

      elements.openPdf.addEventListener('click', () => {
        window.open(state.pdfUrl, '_blank');
      });

      elements.fullscreenToggle.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        elements.body.classList.toggle('fullscreen-active', active);
        elements.fullscreenToggle.textContent = active ? '전체화면 종료' : '전체화면';
      });

      updateThumbnailToggle();
      loadQuickLinks();
      handleResize();

      fetch('pages.json', { cache: 'no-store' })
        .then((response) => response.json())
        .then((data) => {
          state.pages = data;
          elements.totalPages.textContent = data.length;
          renderThumbnails();
          setDisplayMode('single');
          setZoomMode('fit-width');
          renderSpread();
        })
        .catch((error) => {
          console.error('페이지 데이터를 불러오지 못했습니다.', error);
        });
    })();
  </script>
</body>
</html>
