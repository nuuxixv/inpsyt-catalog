<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>INPSYT 2026 Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Pretendard:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #2B398F;
      --primary-light: #eef2ff;
      --text: #1e293b;
      --text-light: #64748b;
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --header-height: 60px;
      --toc-width: 300px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* --- Layout --- */
    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
      transition: var(--transition);
    }

    /* --- Sidebar (TOC) --- */
    .sidebar {
      width: var(--toc-width);
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 50;
      transform: translateX(-100%);
      transition: var(--transition);
      box-shadow: var(--shadow-lg);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      height: var(--header-height);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
    }

    .close-sidebar {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--text-light);
      border-radius: 6px;
    }

    .close-sidebar:hover {
      background: var(--bg);
      color: var(--text);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .toc-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 12px 16px;
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .toc-item:hover {
      background: var(--bg);
    }

    .toc-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .toc-page-num {
      font-size: 0.8rem;
      color: var(--text-light);
      background: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* --- Main Viewer --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
      transition: margin-left 0.3s;
    }

    /* Desktop: Push content when sidebar opens */
    @media (min-width: 1024px) {
      .sidebar {
        position: relative;
        transform: translateX(-100%);
        margin-right: calc(var(--toc-width) * -1);
      }

      .sidebar.open {
        transform: translateX(0);
        margin-right: 0;
      }
    }

    /* --- Header Toolbar --- */
    .toolbar {
      height: var(--header-height);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 40;
      box-shadow: var(--shadow-sm);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      transition: background 0.2s;
    }

    .btn-icon:hover {
      background: var(--bg);
    }

    .btn-icon.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .page-indicator {
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-light);
      padding: 0 12px;
      cursor: pointer;
    }

    .page-indicator:hover {
      color: var(--primary);
    }

    /* --- Search Bar --- */
    .search-container {
      position: relative;
      width: 240px;
      transition: width 0.3s;
    }

    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 36px;
      border: 1px solid var(--border);
      border-radius: 18px;
      font-size: 0.9rem;
      background: var(--bg);
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
    }

    .search-results {
      position: absolute;
      top: 100%;
      right: 0;
      width: 320px;
      max-height: 400px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      margin-top: 8px;
      display: none;
      z-index: 100;
    }

    .search-results.visible {
      display: block;
    }

    .search-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--bg);
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-item:hover {
      background: var(--bg);
    }

    .search-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text);
    }

    .search-item-page {
      font-size: 0.8rem;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    /* --- Viewer Stage --- */
    .viewer-stage {
      flex: 1;
      background: #e2e5e9;
      /* Neutral gray for reading focus */
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }

    .viewer-stage:active {
      cursor: grabbing;
    }

    .book-container {
      position: relative;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1), opacity 0.2s ease;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      background: #fff;
      /* Default Fit: Contain */
      max-width: 100%;
      max-height: 100%;
      display: flex;
    }

    .book-page {
      display: block;
      /* Fit logic handled by JS classes */
    }

    /* Fit Modes */
    .fit-height .book-container {
      height: 96%;
      width: auto;
    }

    .fit-height .book-page {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    .fit-width .book-container {
      width: 96%;
      height: auto;
      overflow-y: auto;
      display: block;
    }

    .fit-width .book-page {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Loading Spinner */
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 10;
      display: none;
    }

    .loader.active {
      display: block;
    }

    @keyframes spin {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* --- Navigation Controls (Floating) --- */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: all 0.2s;
      opacity: 0;
      /* Hidden by default, shown on hover */
    }

    .viewer-stage:hover .nav-btn {
      opacity: 1;
    }

    .nav-btn:hover {
      background: #fff;
      transform: translateY(-50%) scale(1.1);
    }

    .nav-prev {
      left: 20px;
    }

    .nav-next {
      right: 20px;
    }

    /* --- Progress Bar --- */
    .progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(0, 0, 0, 0.1);
      z-index: 60;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* --- Toast Notification --- */
    .toast {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* --- Mobile Responsive --- */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        max-width: 280px;
      }

      .search-container {
        width: 40px;
        overflow: hidden;
      }

      .search-container.expanded {
        width: 200px;
        position: absolute;
        right: 16px;
        background: #fff;
      }

      .search-input {
        padding-left: 36px;
      }

      .nav-btn {
        display: none;
      }

      /* Use swipe on mobile */
      .viewer-stage {
        padding: 0;
      }

      .fit-height .book-container {
        height: 100%;
        width: 100%;
      }

      .fit-height .book-page {
        object-fit: contain;
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">목차</div>
      <button class="close-sidebar" id="closeSidebarBtn">
        <svg viewBox="0 0 24 24">
          <path
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>
    <div class="sidebar-content" id="tocContent">
      <!-- TOC Items injected here -->
    </div>
  </aside>

  <div class="app-container">
    <main class="main-content">
      <!-- Toolbar -->
      <header class="toolbar">
        <div class="toolbar-left">
          <button class="btn-icon" id="toggleSidebarBtn" title="목차">
            <svg viewBox="0 0 24 24">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
          </button>
          <div class="page-indicator" id="pageIndicator">1 / 1</div>
        </div>

        <div class="toolbar-right">
          <div class="search-container" id="searchContainer">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor"
                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="검색..." autocomplete="off">
            <div class="search-results" id="searchResults"></div>
          </div>

          <button class="btn-icon active" id="fitHeightBtn" title="세로 맞춤">
            <svg viewBox="0 0 24 24">
              <path
                d="M15 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h10v14zm2-14v14h2V5h-2z" />
            </svg>
          </button>
          <button class="btn-icon" id="fitWidthBtn" title="가로 맞춤">
            <svg viewBox="0 0 24 24">
              <path
                d="M3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2zm2 0h14v14H5V5zm7 9h-2v-2h2v2zm0-4h-2V8h2v2z" />
            </svg>
          </button>
          <button class="btn-icon" id="fullscreenBtn" title="전체화면">
            <svg viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Viewer -->
      <div class="viewer-stage fit-height" id="viewerStage">
        <div class="loader" id="loader"></div>

        <button class="nav-btn nav-prev" id="prevBtn">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
          </svg>
        </button>

        <div class="book-container" id="bookContainer">
          <!-- Images will be injected here -->
        </div>

        <button class="nav-btn nav-next" id="nextBtn">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
          </svg>
        </button>
      </div>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <!-- Toast -->
      <div class="toast" id="toast">페이지 1</div>
    </main>
  </div>

  <script>
    (function () {
      const state = {
        pages: [],
        currentPage: 1,
        totalPages: 0,
        viewMode: 'fit-height', // 'fit-height' | 'fit-width'
        isSidebarOpen: false,
        searchQuery: ''
      };

      const els = {
        sidebar: document.getElementById('sidebar'),
        toggleSidebarBtn: document.getElementById('toggleSidebarBtn'),
        closeSidebarBtn: document.getElementById('closeSidebarBtn'),
        tocContent: document.getElementById('tocContent'),
        viewerStage: document.getElementById('viewerStage'),
        bookContainer: document.getElementById('bookContainer'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        pageIndicator: document.getElementById('pageIndicator'),
        progressBar: document.getElementById('progressBar'),
        toast: document.getElementById('toast'),
        loader: document.getElementById('loader'),
        fitHeightBtn: document.getElementById('fitHeightBtn'),
        fitWidthBtn: document.getElementById('fitWidthBtn'),
        fullscreenBtn: document.getElementById('fullscreenBtn'),
        searchInput: document.getElementById('searchInput'),
        searchResults: document.getElementById('searchResults'),
        searchContainer: document.getElementById('searchContainer')
      };

      // --- Initialization ---
      async function init() {
        try {
          // Load pages.json
          const res = await fetch('pages.json');
          const data = await res.json();
          state.pages = data;
          state.totalPages = data.length;

          // Load quicklinks.json for TOC
          const linkRes = await fetch('quicklinks.json');
          const links = await linkRes.json();
          renderTOC(links);

          // Initial Render
          renderPage(1);
          updateUI();

          // Event Listeners
          setupEvents();

        } catch (e) {
          console.error('Init failed', e);
          showToast('데이터를 불러오는데 실패했습니다.');
        }
      }

      // --- Rendering ---
      function renderPage(pageNum) {
        if (pageNum < 1 || pageNum > state.totalPages) return;

        // Show loader
        els.loader.classList.add('active');
        els.bookContainer.style.opacity = '0.5';

        const pageData = state.pages[pageNum - 1];
        const imgPath = pageData.file.startsWith('webp/') ? pageData.file : `webp/${pageData.file}`;

        // Create new image
        const img = new Image();
        img.className = 'book-page';
        img.alt = `${pageNum} 페이지`;

        img.onload = () => {
          els.loader.classList.remove('active');
          els.bookContainer.innerHTML = '';
          els.bookContainer.appendChild(img);
          els.bookContainer.style.opacity = '1';
          state.currentPage = pageNum;
          updateUI();

          // Preload next
          if (pageNum < state.totalPages) {
            const nextData = state.pages[pageNum];
            const nextImg = new Image();
            nextImg.src = nextData.file.startsWith('webp/') ? nextData.file : `webp/${nextData.file}`;
          }
        };

        img.src = imgPath;
      }

      function renderTOC(links) {
        els.tocContent.innerHTML = '';
        links.forEach(link => {
          const item = document.createElement('button');
          item.className = 'toc-item';
          item.innerHTML = `
            <span>${link.title}</span>
            <span class="toc-page-num">${link.page}p</span>
          `;
          item.onclick = () => {
            renderPage(link.page);
            if (window.innerWidth < 1024) toggleSidebar(false);
          };
          els.tocContent.appendChild(item);
        });
      }

      function updateUI() {
        // Update Text
        els.pageIndicator.textContent = `${state.currentPage} / ${state.totalPages}`;

        // Update Progress Bar
        const progress = (state.currentPage / state.totalPages) * 100;
        els.progressBar.style.width = `${progress}%`;

        // Update Buttons
        els.prevBtn.style.display = state.currentPage === 1 ? 'none' : 'flex';
        els.nextBtn.style.display = state.currentPage === state.totalPages ? 'none' : 'flex';

        // Update TOC Active State
        const tocItems = els.tocContent.querySelectorAll('.toc-item');
        tocItems.forEach(item => {
          const pageNum = parseInt(item.querySelector('.toc-page-num').textContent);
          if (pageNum === state.currentPage) item.classList.add('active');
          else item.classList.remove('active');
        });
      }

      // --- Actions ---
      function nextPage() {
        if (state.currentPage < state.totalPages) {
          renderPage(state.currentPage + 1);
          showToast(`${state.currentPage + 1} 페이지`);
        }
      }

      function prevPage() {
        if (state.currentPage > 1) {
          renderPage(state.currentPage - 1);
          showToast(`${state.currentPage - 1} 페이지`);
        }
      }

      function toggleSidebar(force) {
        state.isSidebarOpen = force !== undefined ? force : !state.isSidebarOpen;
        if (state.isSidebarOpen) {
          els.sidebar.classList.add('open');
          els.toggleSidebarBtn.classList.add('active');
        } else {
          els.sidebar.classList.remove('open');
          els.toggleSidebarBtn.classList.remove('active');
        }
      }

      function setViewMode(mode) {
        state.viewMode = mode;
        els.viewerStage.className = `viewer-stage ${mode}`;

        els.fitHeightBtn.classList.toggle('active', mode === 'fit-height');
        els.fitWidthBtn.classList.toggle('active', mode === 'fit-width');

        showToast(mode === 'fit-height' ? '세로 맞춤' : '가로 맞춤');
      }

      function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.add('show');
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2000);
      }

      // --- Search ---
      function handleSearch(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
          els.searchResults.classList.remove('visible');
          return;
        }

        const matches = state.pages.filter(p => {
          const text = (p.title + ' ' + (p.text || '')).toLowerCase();
          return text.includes(q);
        }).slice(0, 10); // Limit results

        els.searchResults.innerHTML = '';
        if (matches.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'search-item';
          empty.textContent = '검색 결과가 없습니다.';
          els.searchResults.appendChild(empty);
        } else {
          matches.forEach(p => {
            const item = document.createElement('div');
            item.className = 'search-item';
            item.innerHTML = `
              <div class="search-item-title">${p.title || '제목 없음'}</div>
              <div class="search-item-page">${p.page} 페이지</div>
            `;
            item.onclick = () => {
              renderPage(p.page);
              els.searchResults.classList.remove('visible');
              els.searchInput.value = '';
            };
            els.searchResults.appendChild(item);
          });
        }
        els.searchResults.classList.add('visible');
      }

      // --- Events ---
      function setupEvents() {
        els.prevBtn.onclick = prevPage;
        els.nextBtn.onclick = nextPage;

        els.toggleSidebarBtn.onclick = () => toggleSidebar();
        els.closeSidebarBtn.onclick = () => toggleSidebar(false);

        els.fitHeightBtn.onclick = () => setViewMode('fit-height');
        els.fitWidthBtn.onclick = () => setViewMode('fit-width');

        els.fullscreenBtn.onclick = () => {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen();
          else document.exitFullscreen();
        };

        // Keyboard
        document.addEventListener('keydown', e => {
          if (e.key === 'ArrowLeft') prevPage();
          if (e.key === 'ArrowRight') nextPage();
          if (e.key === 'Escape') {
            els.searchResults.classList.remove('visible');
            toggleSidebar(false);
          }
        });

        // Search Debounce
        let searchTimer;
        els.searchInput.addEventListener('input', e => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => handleSearch(e.target.value), 300);
        });

        // Click outside search
        document.addEventListener('click', e => {
          if (!els.searchContainer.contains(e.target)) {
            els.searchResults.classList.remove('visible');
          }
        });

        // Swipe
        let touchStartX = 0;
        els.viewerStage.addEventListener('touchstart', e => {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        els.viewerStage.addEventListener('touchend', e => {
          const touchEndX = e.changedTouches[0].screenX;
          if (touchEndX < touchStartX - 50) nextPage();
          if (touchEndX > touchStartX + 50) prevPage();
        }, { passive: true });

        // Page Indicator Click -> Prompt
        els.pageIndicator.onclick = () => {
          const num = prompt(`페이지 이동 (1 ~ ${state.totalPages})`);
          if (num) renderPage(parseInt(num));
        };
      }

      init();
    })();
  </script>
</body>

</html>
