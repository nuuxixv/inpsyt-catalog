<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inpsyt 2026 Catalog Viewer</title>
    <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f4f8;
      --panel: #ffffff;
      --border: #dfe3eb;
      --text: #1b2430;
      --muted: #67748b;
      --accent: #1f6bff;
      --shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Pretendard', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      transition: margin 0.3s ease;
    }
    body.nav-hidden nav {
      transform: translateX(-100%);
    }
    body.nav-hidden .nav-handle {
      opacity: 1;
      pointer-events: auto;
    }
    nav {
      width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      transition: transform 0.3s ease;
      z-index: 1000;
    }
    nav header {
      padding: 20px;
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .collapse-button {
      border: none;
      background: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--muted);
    }
    #tocList {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      flex: 1;
    }
    #tocList li button {
      width: 100%;
      border: none;
      background: none;
      padding: 12px 20px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      border-left: 4px solid transparent;
    }
    #tocList li button.active {
      background: rgba(31, 107, 255, 0.12);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    #tocList li button span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .nav-handle {
      position: fixed;
      left: 12px;
      top: 16px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      z-index: 999;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .viewer-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      gap: 20px;
    }
    .toolbar-left strong {
      font-size: 1rem;
      font-weight: 600;
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
    }
    .viewer-toolbar .search input {
      width: 280px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 360px;
      max-height: 320px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      display: none;
      z-index: 900;
    }
    .search-results.visible {
      display: block;
    }
    .search-results button {
      width: 100%;
      text-align: left;
      border: none;
      background: none;
      padding: 10px 14px;
      cursor: pointer;
    }
    .search-results button + button {
      border-top: 1px solid var(--border);
    }
    .search-results button span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .search-results button strong {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }
    .search-empty {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .viewer {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      justify-content: center;
    }
    .page-image img {
      width: 100%;
      max-width: 1100px;
      border-radius: 12px;
      box-shadow: 0 24px 50px rgba(0,0,0,0.18);
      background: #fff;
    }
    .primary {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }
      nav {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow);
      }
      body.nav-show nav {
        transform: translateX(0);
      }
      .nav-handle {
        opacity: 1;
        pointer-events: auto;
      }
      .viewer-toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .toolbar-actions {
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
      }
      .viewer-toolbar .search input {
        width: 100%;
      }
      .search-results {
        right: 0;
        width: 100%;
      }
      .page-image img {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav id="toc">
    <header>紐⑹감</header>
    <section class="manual-index" id="manualIndex"></section>
    <div class="search">
      <input type="search" id="searchInput" placeholder="?쒕ぉ, ?붿빟, 蹂몃Ц 寃?? />
    </div>
    <ul id="tocList"></ul>
  </nav>
  <main>
    <div class="viewer-toolbar">
      <div>
        <button class="toggle-nav" id="toggleNav" type="button">紐⑹감</button>
        <h1 id="pageTitle">遺덈윭?ㅻ뒗 以묅?/h1>
      </div>
      <button class="primary" id="openPdf" type="button">PDF ?먮낯 ?닿린</button>
    </div>
    <div class="viewer">
      <div class="page-image">
        <img id="pageImage" src="" alt="Page" loading="lazy" />
      </div>
      <section class="page-meta">
        <div>
          <h2>?붿빟</h2>
          <p id="pageNote">JSON 濡쒕뵫 以묅?/p>
        </div>
        <div class="page-text" id="pageText"></div>
      </section>
    </div>
  </main>
    <script>
    const state = {
      pages: [],
      active: 0,
      pdfUrl: "2026 인싸이트 카달로그.pdf",
    };

    const elements = {
      toc: document.getElementById("toc"),
      tocList: document.getElementById("tocList"),
      searchInput: document.getElementById("searchInput"),
      collapseNav: document.getElementById("collapseNav"),
      navHandle: document.getElementById("navHandle"),
      pageImage: document.getElementById("pageImage"),
      openPdf: document.getElementById("openPdf"),
      searchResults: document.getElementById("searchResults"),
    };

    function renderTOC() {
      elements.tocList.innerHTML = "";
      state.pages.forEach((page, index) => {
        const li = document.createElement("li");
        const button = document.createElement("button");
        button.textContent = `${page.page}. ${page.title || "제목 없음"}`;
        const hint = document.createElement("span");
        hint.textContent = page.note || "";
        button.appendChild(hint);
        button.dataset.index = index;
        if (index === state.active) button.classList.add("active");
        li.appendChild(button);
        elements.tocList.appendChild(li);
      });
    }

    function loadPage(index) {
      const page = state.pages[index];
      if (!page) return;
      state.active = index;
      elements.pageImage.src = page.file;
      elements.pageImage.alt = page.title || `Page ${page.page}`;
      renderTOC();
      if (window.innerWidth <= 900) {
        hideNav();
      }
    }

    elements.tocList.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      loadPage(Number(button.dataset.index));
    });

    function buildSnippet(text, keyword) {
      if (!text) return "";
      const clean = text.replace(/\s+/g, " ");
      const lower = clean.toLowerCase();
      const idx = lower.indexOf(keyword.toLowerCase());
      const start = Math.max(0, idx - 20);
      return clean.slice(start, start + 120) + (clean.length > start + 120 ? '…' : '');
    }

    function renderSearchResults(keyword) {
      const container = elements.searchResults;
      container.innerHTML = "";
      if (!keyword.trim()) {
        container.classList.remove("visible");
        return;
      }
      const lower = keyword.trim().toLowerCase();
      const matches = state.pages.filter((page) => {
        const haystack = [page.title, page.note, page.text]
          .join(" ")
          .toLowerCase();
        return haystack.includes(lower);
      }).slice(0, 20);

      if (!matches.length) {
        const empty = document.createElement("div");
        empty.className = "search-empty";
        empty.textContent = "검색 결과가 없습니다.";
        container.appendChild(empty);
      } else {
        matches.forEach((page) => {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.page = page.page;
          button.innerHTML = `<strong>${page.page}. ${page.title || "제목 없음"}</strong><span>${buildSnippet(page.text || page.note || "", keyword)}</span>`;
          container.appendChild(button);
        });
      }
      container.classList.add("visible");
    }

    elements.searchInput.addEventListener("input", (event) => {
      renderSearchResults(event.target.value);
    });

    elements.searchResults.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const pageNumber = Number(button.dataset.page);
      const targetIndex = state.pages.findIndex((p) => p.page === pageNumber);
      if (targetIndex !== -1) {
        loadPage(targetIndex);
        elements.searchInput.value = "";
        elements.searchResults.classList.remove("visible");
      }
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".search")) {
        elements.searchResults.classList.remove("visible");
      }
    });

    function hideNav() {
      document.body.classList.add("nav-hidden");
      document.body.classList.remove("nav-show");
    }

    function showNav() {
      document.body.classList.remove("nav-hidden");
      if (window.innerWidth <= 900) {
        document.body.classList.add("nav-show");
      }
    }

    elements.collapseNav.addEventListener("click", hideNav);
    elements.navHandle.addEventListener("click", showNav);

    elements.openPdf.addEventListener("click", () => {
      window.open(state.pdfUrl, "_blank");
    });

    function handleResize() {
      if (window.innerWidth > 900) {
        document.body.classList.remove("nav-hidden", "nav-show");
      } else {
        document.body.classList.add("nav-hidden");
      }
    }

    window.addEventListener("resize", handleResize);

    fetch("pages.json")
      .then((resp) => resp.json())
      .then((data) => {
        state.pages = data;
        renderTOC();
        loadPage(0);
      })
      .catch((err) => {
        console.error(err);
      });

    handleResize();
  </script>
</body>
</html>
